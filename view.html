<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결과물 보기 — 바이브 코딩 워크숍</title>
<style>
  html,body{margin:0;height:100%;background:#f5f3ff;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;}
  *{box-sizing:border-box;}
  #bar{position:fixed;top:0;left:0;right:0;height:48px;background:#1f2130;color:#fff;
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;
    font-size:13.5px;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.2);}
  #bar a.back{color:#fff;text-decoration:none;font-weight:700;background:rgba(255,255,255,.15);
    padding:6px 12px;border-radius:8px;white-space:nowrap;}
  #bar .title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:center;}
  #frame-wrap{position:fixed;top:48px;left:0;right:0;bottom:0;background:#fff;}
  iframe{width:100%;height:100%;border:none;display:block;}
  #status{position:fixed;top:48px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;
    font-size:15px;color:#6b6f85;text-align:center;padding:20px;}
</style>
</head>
<body>

<div id="bar">
  <a class="back" href="gallery.html">← 갤러리로</a>
  <span class="title" id="titleText">불러오는 중...</span>
  <span style="width:70px;"></span>
</div>
<div id="status">불러오는 중...</div>
<div id="frame-wrap" style="display:none;">
  <iframe id="frame" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
</div>

<script>
const DB = "https://gwangsu-on-default-rtdb.firebaseio.com";
const GALLERY_PATH = "years/2026/workshopTT/gallery";
const FILES_PATH = "years/2026/workshopTT/galleryFiles";

const id = new URLSearchParams(location.search).get('id');
const statusEl = document.getElementById('status');

async function load(){
  if(!id){ statusEl.textContent = '잘못된 링크예요 (id가 없어요).'; return; }
  try{
    const [metaRes, fileRes] = await Promise.all([
      fetch(`${DB}/${GALLERY_PATH}/${id}.json`),
      fetch(`${DB}/${FILES_PATH}/${id}.json`)
    ]);
    const meta = await metaRes.json();
    const file = await fileRes.json();
    if(!file || !file.html){ statusEl.textContent = '첨부된 HTML 파일을 찾을 수 없어요.'; return; }

    const label = meta ? [meta.title, meta.name].filter(Boolean).join(' — ') : '결과물 보기';
    document.getElementById('titleText').textContent = label;
    document.title = (meta && meta.title ? meta.title : '결과물 보기') + ' — 바이브 코딩 워크숍';

    document.getElementById('frame').srcdoc = file.html;
    statusEl.style.display = 'none';
    document.getElementById('frame-wrap').style.display = 'block';
  }catch(e){
    console.error(e);
    statusEl.textContent = '불러오는 중 오류가 발생했어요.';
  }
}

load();
</script>
</body>
</html>
